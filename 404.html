<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <style>
      body { display: grid; min-height: 100vh; margin: 0; color: #172330; background: #f4f1ea; font-family: Georgia, serif; place-items: center; }
      main { width: min(620px, calc(100% - 40px)); text-align: center; }
      strong { display: block; color: #4f70d8; font-size: clamp(90px, 22vw, 180px); font-weight: 400; line-height: 0.8; }
      h1 { margin: 30px 0 10px; font-size: 34px; font-weight: 400; }
      p { color: #45505a; font-family: Arial, sans-serif; line-height: 1.6; }
      a { display: inline-block; margin-top: 20px; padding: 13px 20px; color: #f4f1ea; background: #172330; font-family: Arial, sans-serif; font-size: 13px; text-decoration: none; }
    </style>
  </head>
  <body><main><strong>404</strong><h1>This page wandered off.</h1><p>The link may be outdated, but the homepage is right where you left it.</p><a href="/">Return home →</a></main></body>
